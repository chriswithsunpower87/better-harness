<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" aria-labelledby="title desc" role="img" viewBox="0 0 1800 1040"><title id="title">Harness Inspector architecture</title><desc id="desc">A local, read-only evidence pipeline. Feature Tree, coding-agent sessions, Git history, and Entire checkpoints enter a bounded collector, are privacy-filtered and normalized, correlated with explicit evidence limits, projected into HarnessInspectorReportV1, and rendered as a self-contained HTML workbench.</desc><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.section{fill:#8e9a94;font-size:18px;font-weight:700;letter-spacing:2px}.label,.label-sm{fill:#f4f7f5;font-size:26px;font-weight:700}.label-sm{font-size:21px}.hint{fill:#aeb9b3;font-size:17px;font-weight:400}.source{fill:#171b1d;stroke:#59655f;stroke-width:2}.evidence,.process{stroke-width:2.4}.process{fill:#151f27;stroke:#669fd0}.evidence{fill:#17231c;stroke:#72c77c}.output{fill:#1a1d1c;stroke:#8e9a94;stroke-width:2}.blue{stroke:#77b7f2;stroke-width:3}.blue,.gray,.green{fill:none;stroke-linecap:round;stroke-linejoin:round}.green{stroke-width:3;stroke:#79cf83}.gray{stroke:#68756e;stroke-width:2.6}</style><marker id="arrow-blue" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="none" stroke="#77b7f2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M1 1L10 6L1 11"/></marker><marker id="arrow-green" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="none" stroke="#79cf83" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M1 1L10 6L1 11"/></marker><marker id="arrow-gray" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="none" stroke="#68756e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1L10 6L1 11"/></marker></defs><rect width="1800" height="1040" fill="#101415"/><text x="80" y="58" class="section">1 · LOCAL EVIDENCE SOURCES</text><rect width="500" height="112" x="80" y="86" class="source" rx="16"/><text x="330" y="130" class="label-sm" text-anchor="middle">Feature Tree</text><text x="330" y="163" class="hint" text-anchor="middle">Feature · Story · reviewed references</text><rect width="500" height="112" x="650" y="86" class="source" rx="16"/><text x="900" y="130" class="label-sm" text-anchor="middle">10 session adapters</text><text x="900" y="163" class="hint" text-anchor="middle">prompts · dialogue · tool calls</text><rect width="500" height="112" x="1220" y="86" class="source" rx="16"/><text x="1470" y="130" class="label-sm" text-anchor="middle">Git + Entire</text><text x="1470" y="163" class="hint" text-anchor="middle">commits · files · checkpoints</text><path d="M330 198V246H900" class="gray"/><path d="M900 198V246" class="gray"/><path d="M1470 198V246H900" class="gray"/><path marker-end="url(#arrow-blue)" d="M900 246V276" class="blue"/><text x="80" y="278" class="section">2 · BOUNDED LOCAL PROJECTION</text><rect width="430" height="118" x="170" y="300" class="process" rx="16"/><text x="385" y="345" class="label-sm" text-anchor="middle">Collect a bounded window</text><text x="385" y="378" class="hint" text-anchor="middle">time · sessions · commits · providers</text><path marker-end="url(#arrow-blue)" d="M600 359H708" class="blue"/><rect width="430" height="118" x="730" y="300" class="process" rx="16"/><text x="945" y="345" class="label-sm" text-anchor="middle">Normalize safely</text><text x="945" y="378" class="hint" text-anchor="middle">redaction · relative paths · actions</text><path marker-end="url(#arrow-blue)" d="M1160 359H1268" class="blue"/><rect width="340" height="118" x="1290" y="300" class="process" rx="16"/><text x="1460" y="345" class="label-sm" text-anchor="middle">Preserve gaps</text><text x="1460" y="378" class="hint" text-anchor="middle">missing stays unobserved</text><path marker-end="url(#arrow-green)" d="M900 418V486" class="green"/><text x="80" y="478" class="section">3 · EVIDENCE-BOUNDED CORRELATION</text><rect width="1440" height="132" x="180" y="506" class="evidence" rx="18"/><text x="900" y="551" class="label" text-anchor="middle">Relate intent, sessions, tool calls, paths, and commits</text><text x="360" y="599" class="label-sm" text-anchor="middle">Explicit / direct</text><text x="720" y="599" class="label-sm" text-anchor="middle">Observed same-path</text><text x="1080" y="599" class="label-sm" text-anchor="middle">Candidate</text><text x="1440" y="599" class="label-sm" text-anchor="middle">Contextual</text><path marker-end="url(#arrow-green)" d="M900 638V700" class="green"/><text x="80" y="690" class="section">4 · READ-ONLY INSPECTOR</text><rect width="680" height="86" x="560" y="720" class="evidence" rx="18"/><text x="900" y="773" class="label" text-anchor="middle">HarnessInspectorReportV1</text><path marker-end="url(#arrow-gray)" d="M900 806V846" class="gray"/><rect width="380" height="100" x="70" y="870" class="output" rx="15"/><text x="260" y="913" class="label-sm" text-anchor="middle">Delivery Tree / Date</text><text x="260" y="945" class="hint" text-anchor="middle">choose the review scope</text><rect width="380" height="100" x="490" y="870" class="output" rx="15"/><text x="680" y="913" class="label-sm" text-anchor="middle">Three evidence lanes</text><text x="680" y="945" class="hint" text-anchor="middle">prompt · activity · delivery</text><rect width="380" height="100" x="910" y="870" class="output" rx="15"/><text x="1100" y="913" class="label-sm" text-anchor="middle">Evidence Drawer</text><text x="1100" y="945" class="hint" text-anchor="middle">facts · source · limitations</text><rect width="400" height="100" x="1330" y="870" class="output" rx="15"/><text x="1530" y="913" class="label-sm" text-anchor="middle">Session Trace / Replay</text><text x="1530" y="945" class="hint" text-anchor="middle">observe; never rerun or resume</text><path d="M900 846H260V870" class="gray"/><path d="M900 846H680V870" class="gray"/><path d="M900 846H1100V870" class="gray"/><path d="M900 846H1530V870" class="gray"/></svg>