<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" aria-labelledby="title desc" role="img" viewBox="0 0 1800 1360"><title id="title">Better Harness architecture</title><desc id="desc">A six-stage architecture showing ten capability-level host adapters, including six verified Quickstart hosts plus Pi, Kimi Code, WorkBuddy, and Grok adapter support, followed by the Better Harness workflow, three independent evidence agents, unified analysis, host-neutral outputs, and repair.</desc><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.section{fill:#8e9a94;font-size:18px;font-weight:700;letter-spacing:2px}.label,.label-sm{fill:#f4f7f5;font-size:25px;font-weight:700}.label-sm{font-size:21px}.hint-sm{fill:#aeb9b3;font-size:16px;font-weight:400}.host{fill:#171b1d;stroke:#59655f;stroke-width:2}.control{fill:#17231c;stroke:#72c77c;stroke-width:2.5}.lane{fill:#151f27;stroke:#669fd0;stroke-width:2.2}.artifact{fill:#1a1d1c;stroke:#6f7a75;stroke-width:2}.blue{stroke-width:3}.blue,.gray,.green{fill:none;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#79cf83;stroke-width:3}.blue{stroke:#77b7f2}.gray{stroke:#68756e;stroke-width:2.6}</style><marker id="arrow-green" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="none" stroke="#79cf83" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M1 1L10 6L1 11"/></marker><marker id="arrow-blue" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="none" stroke="#77b7f2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M1 1L10 6L1 11"/></marker><marker id="arrow-gray" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="none" stroke="#68756e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1L10 6L1 11"/></marker></defs><rect width="1800" height="1360" fill="#101415"/><text x="80" y="58" class="section">1 · HOST INTEGRATION · 10 CAPABILITY ADAPTERS</text><rect width="700" height="78" x="150" y="82" class="host" rx="14"/><text x="500" y="115" class="label-sm" text-anchor="middle">6 verified Quickstart hosts</text><text x="500" y="143" class="hint-sm" text-anchor="middle">Claude · Codex · Qoder · Cursor · Qwen · Copilot</text><rect width="700" height="78" x="950" y="82" class="host" rx="14"/><text x="1300" y="115" class="label-sm" text-anchor="middle">Pi + Kimi + WorkBuddy + Grok adapters</text><text x="1300" y="143" class="hint-sm" text-anchor="middle">support boundaries documented</text><path d="M500 160V180H900" class="gray"/><path d="M1300 160V180H900" class="gray"/><path marker-end="url(#arrow-green)" d="M900 180V205" class="green"/><rect width="880" height="74" x="460" y="224" class="control" rx="16"/><text x="900" y="269" class="label" text-anchor="middle">Better Harness Plugin &amp; Host Adapters</text><path marker-end="url(#arrow-green)" d="M900 298V357" class="green"/><text x="80" y="342" class="section">2 · SKILL WORKFLOW</text><rect width="880" height="78" x="460" y="376" class="control" rx="16"/><text x="900" y="424" class="label" text-anchor="middle">Better Harness Skill Workflow</text><path d="M900 454V550" class="green"/><text x="80" y="500" class="section">3 · INDEPENDENT EVIDENCE AGENTS</text><path d="M320 550H1480" class="green"/><path marker-end="url(#arrow-blue)" d="M320 550V580" class="blue"/><path marker-end="url(#arrow-blue)" d="M900 550V580" class="blue"/><path marker-end="url(#arrow-blue)" d="M1480 550V580" class="blue"/><rect width="500" height="108" x="70" y="600" class="lane" rx="15"/><text x="320" y="638" class="label-sm" text-anchor="middle">Session Evidence</text><text x="320" y="670" class="hint-sm" text-anchor="middle">session-analysis facts</text><text x="320" y="693" class="hint-sm" text-anchor="middle">bounded Episodes &amp; outcomes</text><rect width="500" height="108" x="650" y="600" class="lane" rx="15"/><text x="900" y="638" class="label-sm" text-anchor="middle">Project Harness</text><text x="900" y="670" class="hint-sm" text-anchor="middle">core-change-watch</text><text x="900" y="693" class="hint-sm" text-anchor="middle">project &amp; delivery evidence</text><rect width="500" height="108" x="1230" y="600" class="lane" rx="15"/><text x="1480" y="638" class="label-sm" text-anchor="middle">Agent Customize</text><text x="1480" y="670" class="hint-sm" text-anchor="middle">lint · inventory · integrity</text><text x="1480" y="693" class="hint-sm" text-anchor="middle">one shared asset snapshot</text><path d="M320 708V748H900" class="blue"/><path d="M900 708V748" class="blue"/><path d="M1480 708V748H900" class="blue"/><path marker-end="url(#arrow-blue)" d="M900 748V776" class="blue"/><text x="80" y="766" class="section">4 · UNIFIED LEAD ANALYSIS</text><rect width="960" height="84" x="410" y="796" class="control" rx="18"/><text x="890" y="848" class="label" text-anchor="middle">Lead Agent</text><path marker-end="url(#arrow-green)" d="M890 880V996H340V1006" class="green"/><text x="80" y="976" class="section">5 · ARTIFACTS &amp; HOST OUTPUTS</text><rect width="420" height="88" x="130" y="1016" class="artifact" rx="15"/><text x="340" y="1069" class="label" text-anchor="middle">Findings</text><path marker-end="url(#arrow-gray)" d="M550 1060H658" class="gray"/><rect width="440" height="88" x="680" y="1016" class="artifact" rx="15"/><text x="900" y="1054" class="label" text-anchor="middle">Render &amp; Validate</text><text x="900" y="1083" class="hint-sm" text-anchor="middle">Canvas or HTML</text><path marker-end="url(#arrow-gray)" d="M1120 1060H1228" class="gray"/><rect width="420" height="88" x="1250" y="1016" class="artifact" rx="15"/><text x="1460" y="1054" class="label" text-anchor="middle">Host Outputs</text><text x="1460" y="1083" class="hint-sm" text-anchor="middle">Qoder Canvas · portable HTML</text><path marker-end="url(#arrow-green)" d="M340 1104V1158H420V1192" class="green"/><text x="80" y="1178" class="section">6 · REPAIR</text><rect width="400" height="82" x="220" y="1212" class="control" rx="15"/><text x="420" y="1263" class="label" text-anchor="middle">Repair</text><path marker-end="url(#arrow-green)" d="M620 1253H680" class="green"/><rect width="400" height="82" x="700" y="1212" class="control" rx="15"/><text x="900" y="1263" class="label" text-anchor="middle">Validate</text><path marker-end="url(#arrow-green)" d="M1100 1253H1160" class="green"/><rect width="400" height="82" x="1180" y="1212" class="control" rx="15"/><text x="1380" y="1263" class="label" text-anchor="middle">Record</text></svg>